version: 46
jobs:
- name: Push To Github
  steps:
  - type: PushRepository
    name: Push To GitHub
    remoteUrl: https://github.com/cloudmindsab/td-synnex
    userName: cloudmindsab
    passwordSecret: access-token
    force: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
